# Dependabot opens a pull request when a dependency has a security fix or a new version.
# After merging one, update the server: cd ~/MuhallaReads && git pull && sudo bash deploy/oracle/setup.sh
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
